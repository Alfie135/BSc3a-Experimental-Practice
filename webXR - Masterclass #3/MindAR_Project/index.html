<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script> -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
    <a-scene mindar-image="imageTargetSrc: targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <img id="card"
                src="./BREACH.jpg" />
            <a-asset-item id="keyChainModel"
                src="./21_pilots.glb"></a-asset-item>
                <a-asset-item id="funkoModel"
                src="./Clancy.glb"></a-asset-item>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane src="#card" opacity="0.7" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
            <a-gltf-model rotation="90 0 0" position="0 0 0.3" scale="15 15 15" src="#keyChainModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
              <a-gltf-model rotation="0 0 0" position="-0.3 -0.2 0.2" scale="600 600 600" src="#funkoModel" animation="property: position; to: -0.3 -0.1 0.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
        </a-entity>
    </a-scene>
</body>

</html>
